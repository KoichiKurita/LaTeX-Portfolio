name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# ワークフロー全体の既定は読み取り専用（最小権限の原則）
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR では一時的なマージコミットではなく、ブランチの先頭コミットをビルドする
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # 再現可能ビルド：最終コミットの時刻をコンテナに渡す
      - name: Set SOURCE_DATE_EPOCH
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          git log -1 --format='Commit: %H%nDate:   %ci (%ct)'

      # ローカルと同じ .devcontainer でコンテナを作り、その中でビルド
      - name: Build in Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/koichikurita/latex-portfolio-devcontainer
          push: never
          env: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          runCmd: make build

      - name: Check unresolved references
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation) .* undefined" output/main.log; then
            echo "::error::未解決の参照・引用があります"
            exit 1
          fi

      - name: Checksum
        run: |
          {
            echo "### PDF SHA-256"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo "- SOURCE_DATE_EPOCH: \`${SOURCE_DATE_EPOCH}\`"
            echo '```'
            sha256sum output/main.pdf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-pdf
          path: output/main.pdf
          retention-days: 30

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # ジョブ単位の permissions はワークフロー既定を「上書き」するため、
    # checkout に必要な contents: read も明示する
    permissions:
      contents: read
      pages: write        # Pages へのデプロイ
      id-token: write     # OIDC 認証（長期トークン不要）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-pdf
          path: site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-pdf

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: main.pdf
          generate_release_notes: true   # マージした PR からリリースノートを自動生成
