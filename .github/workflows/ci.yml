name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# ワークフロー全体の既定は読み取り専用（最小権限の原則）
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR では一時的なマージコミットではなく、ブランチの先頭コミットをビルドする
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # バージョン表示（git describe）のため、タグを含む全履歴を取得する
          fetch-depth: 0

      # 再現可能ビルド：最終コミットの時刻をコンテナに渡す
      - name: Set build metadata
        env:
            BASE_REF: ${{ github.base_ref }}   # PR の比較先ブランチ（push では空）
        run: |
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "DOC_VERSION=$(git describe --tags --match 'v*' --dirty --abbrev=7 2>/dev/null || echo dev)"
            echo "DOC_COMMIT=$(git rev-parse --short=7 HEAD)"
            # PR のときだけ差分 PDF の比較元を設定する
            if [ -n "$BASE_REF" ]; then echo "DIFF_BASE=origin/$BASE_REF"; fi
          } >> "$GITHUB_ENV"
          git log -1 --format='Commit: %H%nDate:   %ci (%ct)'

      # ローカルと同じ .devcontainer でコンテナを作り、その中でビルド
      - name: Build in Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/koichikurita/latex-portfolio-devcontainer
          push: never
          env: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            DOC_VERSION=${{ env.DOC_VERSION }}
            DOC_COMMIT=${{ env.DOC_COMMIT }}
            DIFF_BASE=${{ env.DIFF_BASE }}
          # 差分 PDF はレビュー補助のため、生成に失敗してもマージは止めない（警告のみ）
          runCmd: |
            set -e
            make check
            if [ -n "$DIFF_BASE" ]; then
              git config --global --add safe.directory "$PWD"
              make diff || echo "::warning::差分 PDF の生成に失敗しました"
            fi

      - name: Check unresolved references
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation) .* undefined" output/main.log; then
            echo "::error::未解決の参照・引用があります"
            exit 1
          fi

      # PDF/A-3b（長期保存）と PDF/UA-1（アクセシビリティ）への適合を veraPDF で検査する
      - name: Validate PDF standards (veraPDF)
        shell: bash   # 明示すると pipefail が有効になり、tee を挟んでも失敗を検出できる
        run: |
          ./scripts/check-pdf-standard.sh output/main.pdf 3b  | tee -a "$GITHUB_STEP_SUMMARY"
          ./scripts/check-pdf-standard.sh output/main.pdf ua1 | tee -a "$GITHUB_STEP_SUMMARY"

      # 不合格のときは、違反した規則を確認できるようレポートを添付する
      - name: Upload veraPDF reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verapdf-reports
          path: output/verapdf-report-*.xml
          retention-days: 14

      - name: Checksum
        run: |
          {
            echo "### PDF SHA-256"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            if [ -f output/diff/diff.pdf ]; then
              echo "差分 PDF（${DIFF_BASE} → この PR）は Artifacts の **diff-pdf** からダウンロードできます。"
            fi
            echo "- Version: \`${DOC_VERSION}\`"
            echo "- SOURCE_DATE_EPOCH: \`${SOURCE_DATE_EPOCH}\`"
            echo '```'
            sha256sum output/main.pdf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-pdf
          path: output/main.pdf
          retention-days: 30

      - name: Upload diff PDF
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff-pdf
          path: output/diff/diff.pdf
          retention-days: 14
          if-no-files-found: warn

  deploy-pages:
    # 公開ページ＝最新リリース：タグの push 時のみデプロイする
    # （main とタグの同時 push でデプロイが競合し、古い PDF で上書きされるのを防ぐ）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    # 万一デプロイが重なっても、並列ではなく順番に実行する（実行中のものはキャンセルしない）
    concurrency:
      group: pages
      cancel-in-progress: false
    # ジョブ単位の permissions はワークフロー既定を「上書き」するため、
    # checkout に必要な contents: read も明示する
    permissions:
      contents: read
      pages: write        # Pages へのデプロイ
      id-token: write     # OIDC 認証（長期トークン不要）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-pdf
          path: site

      # PDF をバージョン付きのファイル名でも配置し、index.html から参照する
      # （GitHub Pages の CDN は URL の ?v= ではキャッシュを確実に回避できないため、ファイル名を変える）
      # タグ名は環境変数経由で渡す（式展開を run に直接書くとスクリプト注入の恐れがあるため）
      - name: Stamp version into index.html
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          commit="${GITHUB_SHA::7}"
          pdf="LaTeX-Portfolio-${VERSION}.pdf"
          cp site/main.pdf "site/${pdf}"
          sed -i -e "s|__VERSION__|${VERSION}|g" \
                 -e "s|__COMMIT__|${commit}|g" \
                 -e "s|__PDF__|${pdf}|g" site/index.html
          if grep -q "__VERSION__\|__COMMIT__\|__PDF__" site/index.html; then
            echo "::error::index.html の置換漏れがあります"
            exit 1
          fi
          ls -l site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-pdf

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: main.pdf
          generate_release_notes: true   # マージした PR からリリースノートを自動生成
