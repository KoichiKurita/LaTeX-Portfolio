name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチで新しい実行が始まったら、古い実行をキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: src/main.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error -halt-on-error -outdir=output

      - name: Check unresolved references
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation) .* undefined" output/main.log; then
            echo "::error::未解決の参照・引用があります"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: output/main.pdf
          retention-days: 30

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: main-pdf
          path: site

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: main-pdf

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: main.pdf
